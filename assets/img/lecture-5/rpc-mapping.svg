<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="t d">
  <title id="t">RPC Mapping</title>
  <desc id="d">Сравнение RPC-паттернов NGO и FishNet</desc>
  <rect width="960" height="500" rx="28" fill="#101b2f"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="160" y="64" fill="#ffd479" font-size="30" font-weight="800">NGO</text>
    <text x="738" y="64" fill="#75e3ce" font-size="30" font-weight="800">FishNet</text>
    <g fill="#1d2d46" stroke="#35527c">
      <rect x="70" y="110" width="250" height="72" rx="18"/>
      <rect x="70" y="214" width="250" height="72" rx="18"/>
      <rect x="70" y="318" width="250" height="72" rx="18"/>
      <rect x="640" y="110" width="250" height="72" rx="18"/>
      <rect x="640" y="214" width="250" height="72" rx="18"/>
      <rect x="640" y="318" width="250" height="72" rx="18"/>
    </g>
    <g fill="#e7eefc" font-size="24" font-weight="700" text-anchor="middle">
      <text x="195" y="154">[ServerRpc]</text>
      <text x="195" y="258">[ClientRpc]</text>
      <text x="195" y="362">ClientRpcParams</text>
      <text x="765" y="154">[ServerRpc]</text>
      <text x="765" y="258">[ObserversRpc]</text>
      <text x="765" y="362">[TargetRpc]</text>
    </g>
    <g stroke-width="8" stroke-linecap="round" fill="none">
      <path d="M350 146h250" stroke="#37c8a7"/>
      <path d="M350 250h250" stroke="#37c8a7"/>
      <path d="M350 354h250" stroke="#37c8a7"/>
    </g>
    <g fill="#9eb0c9" font-size="18" text-anchor="middle">
      <text x="475" y="136">same direction</text>
      <text x="475" y="240">all clients → only observers</text>
      <text x="475" y="344">list of targets → explicit connection</text>
    </g>
  </g>
</svg>
