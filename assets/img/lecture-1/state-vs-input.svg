<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="t d">
  <title id="t">State Sync vs Input Sync</title>
  <desc id="d">Сравнение передачи состояния и ввода</desc>
  <rect width="1200" height="460" fill="#0f1a2c"/>
  <g font-family="Manrope,Segoe UI,sans-serif" fill="#e7eefc">
    <text x="600" y="55" text-anchor="middle" font-size="38" font-weight="800">State Sync vs Input Sync</text>
    <rect x="90" y="95" width="480" height="320" rx="20" fill="#17243a" stroke="#35527a"/>
    <rect x="630" y="95" width="480" height="320" rx="20" fill="#17243a" stroke="#35527a"/>
    <text x="330" y="140" text-anchor="middle" font-size="32" font-weight="800" fill="#75e3ce">STATE SYNC</text>
    <text x="870" y="140" text-anchor="middle" font-size="32" font-weight="800" fill="#ffd166">INPUT SYNC</text>
    <text x="120" y="195" font-size="24">Передаём результат</text>
    <text x="120" y="235" font-size="24">"Я на позиции (x,y,z)"</text>
    <text x="120" y="275" font-size="24">Проще реализовать</text>
    <text x="120" y="315" font-size="24">Надёжнее, но больше трафика</text>
    <text x="120" y="365" font-size="21" fill="#9eb0c9">FPS/TPS, большинство игр</text>

    <text x="660" y="195" font-size="24">Передаём намерение</text>
    <text x="660" y="235" font-size="24">"Нажал W", "Нажал Fire"</text>
    <text x="660" y="275" font-size="24">Меньше трафика</text>
    <text x="660" y="315" font-size="24">Сложнее синхронизация</text>
    <text x="660" y="365" font-size="21" fill="#9eb0c9">Файтинги, Rocket League</text>
  </g>
</svg>
