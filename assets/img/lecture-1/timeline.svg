    <circle cx="790" cy="220" r="22" fill="#37c8a7"/><text x="790" y="165" font-size="26" font-weight="800">2017</text><text x="790" y="275" font-size="24" font-weight="700">Fortnite</text><text x="790" y="305" font-size="18" fill="#9eb0c9">Cloud, 100 игроков</text>
    <circle cx="1010" cy="220" r="22" fill="#ffd166"/><text x="1010" y="165" font-size="26" font-weight="800">2026</text><text x="1010" y="275" font-size="24" font-weight="700">Ваш проект</text><text x="1010" y="305" font-size="18" fill="#9eb0c9">Unity NGO</text>
