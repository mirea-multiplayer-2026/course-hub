<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="t d">
  <title id="t">Топологии мультиплеера</title>
  <desc id="d">P2P, Listen Server, Dedicated Server</desc>
  <rect width="1200" height="500" fill="#0f1a2c"/>
  <g font-family="Manrope,Segoe UI,sans-serif" fill="#e7eefc" text-anchor="middle">
    <text x="600" y="52" font-size="38" font-weight="800">Три модели мультиплеера</text>
    <rect x="40" y="90" width="350" height="370" rx="20" fill="#17243a" stroke="#35527a"/>
    <rect x="425" y="90" width="350" height="370" rx="20" fill="#17243a" stroke="#35527a"/>
    <rect x="810" y="90" width="350" height="370" rx="20" fill="#17243a" stroke="#35527a"/>

    <text x="215" y="132" font-size="28" font-weight="700">P2P</text>
    <circle cx="145" cy="220" r="22" fill="#37c8a7"/><text x="145" y="228" font-size="18" fill="#05221c" font-weight="800">A</text>
    <circle cx="280" cy="220" r="22" fill="#37c8a7"/><text x="280" y="228" font-size="18" fill="#05221c" font-weight="800">B</text>
    <circle cx="215" cy="315" r="22" fill="#37c8a7"/><text x="215" y="323" font-size="18" fill="#05221c" font-weight="800">C</text>
    <line x1="145" y1="220" x2="280" y2="220" stroke="#9eb0c9" stroke-width="3"/>
    <line x1="145" y1="220" x2="215" y2="315" stroke="#9eb0c9" stroke-width="3"/>
    <line x1="280" y1="220" x2="215" y2="315" stroke="#9eb0c9" stroke-width="3"/>
    <text x="215" y="410" font-size="19" fill="#9eb0c9">Все со всеми</text>

    <text x="600" y="132" font-size="28" font-weight="700">Listen Server</text>
    <circle cx="600" cy="195" r="28" fill="#ffd166"/><text x="600" y="203" font-size="18" fill="#412f00" font-weight="800">HOST</text>
    <circle cx="525" cy="305" r="20" fill="#37c8a7"/><text x="525" y="312" font-size="16" fill="#05221c" font-weight="800">B</text>
    <circle cx="675" cy="305" r="20" fill="#37c8a7"/><text x="675" y="312" font-size="16" fill="#05221c" font-weight="800">C</text>
    <line x1="600" y1="223" x2="525" y2="285" stroke="#9eb0c9" stroke-width="3"/>
    <line x1="600" y1="223" x2="675" y2="285" stroke="#9eb0c9" stroke-width="3"/>
    <text x="600" y="410" font-size="19" fill="#9eb0c9">Хост = сервер + клиент</text>

    <text x="985" y="132" font-size="28" font-weight="700">Dedicated</text>
    <rect x="942" y="170" width="86" height="44" rx="10" fill="#ffd166"/>
    <text x="985" y="198" font-size="18" fill="#412f00" font-weight="800">Server</text>
    <circle cx="900" cy="310" r="20" fill="#37c8a7"/><text x="900" y="317" font-size="16" fill="#05221c" font-weight="800">A</text>
    <circle cx="985" cy="335" r="20" fill="#37c8a7"/><text x="985" y="342" font-size="16" fill="#05221c" font-weight="800">B</text>
    <circle cx="1070" cy="310" r="20" fill="#37c8a7"/><text x="1070" y="317" font-size="16" fill="#05221c" font-weight="800">C</text>
    <line x1="985" y1="214" x2="900" y2="290" stroke="#9eb0c9" stroke-width="3"/>
    <line x1="985" y1="214" x2="985" y2="315" stroke="#9eb0c9" stroke-width="3"/>
    <line x1="985" y1="214" x2="1070" y2="290" stroke="#9eb0c9" stroke-width="3"/>
    <text x="985" y="410" font-size="19" fill="#9eb0c9">Выделенный сервер</text>
  </g>
</svg>
