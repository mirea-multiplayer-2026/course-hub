<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
  <title id="t">Интерполяция и экстраполяция</title>
  <desc id="d">Схема сглаживания и предсказания движения</desc>
  <rect width="1200" height="420" fill="#0f1a2c"/>
  <g font-family="Manrope,Segoe UI,sans-serif" fill="#e7eefc">
    <text x="300" y="52" text-anchor="middle" font-size="34" font-weight="800">Интерполяция</text>
    <text x="900" y="52" text-anchor="middle" font-size="34" font-weight="800">Экстраполяция</text>

    <line x1="80" y1="300" x2="520" y2="300" stroke="#3f628e" stroke-width="4"/>
    <circle cx="120" cy="300" r="10" fill="#37c8a7"/>
    <circle cx="220" cy="280" r="8" fill="#9fded1"/>
    <circle cx="320" cy="260" r="8" fill="#9fded1"/>
    <circle cx="420" cy="240" r="8" fill="#9fded1"/>
    <circle cx="500" cy="220" r="10" fill="#37c8a7"/>
    <text x="120" y="330" font-size="18" text-anchor="middle">A (0,0)</text>
    <text x="500" y="250" font-size="18" text-anchor="middle">B (10,0)</text>
    <text x="300" y="370" text-anchor="middle" font-size="20" fill="#9eb0c9">Плавное движение между A и B</text>

    <line x1="680" y1="300" x2="1120" y2="300" stroke="#3f628e" stroke-width="4"/>
    <circle cx="760" cy="280" r="10" fill="#37c8a7"/>
    <line x1="760" y1="280" x2="980" y2="230" stroke="#ffd166" stroke-width="4" stroke-dasharray="10 8"/>
    <circle cx="980" cy="230" r="10" fill="#ffd166"/>
    <text x="760" y="320" font-size="18" text-anchor="middle">Текущая pos</text>
    <text x="980" y="260" font-size="18" text-anchor="middle">Предсказанная pos</text>
    <text x="900" y="370" text-anchor="middle" font-size="20" fill="#9eb0c9">Предсказание по скорости</text>
  </g>
</svg>
