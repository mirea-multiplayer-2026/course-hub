<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d">
  <title id="t">Pool problem graph</title>
  <desc id="d">Allocation spikes without pooling and stable line with pooling.</desc>
  <rect width="1200" height="680" fill="#0f172a"/>
  <g stroke="#475569" stroke-width="2">
    <line x1="120" y1="580" x2="1080" y2="580"/>
    <line x1="120" y1="100" x2="120" y2="580"/>
  </g>
  <g font-family="Manrope, Segoe UI, Arial" fill="#e2e8f0" font-size="24">
    <text x="94" y="92">Allocations</text>
    <text x="1020" y="620">Time</text>
    <text x="120" y="52" font-size="42" font-weight="800">Spawn/Despawn vs Pooling</text>
  </g>

  <polyline points="140,520 200,470 260,540 320,260 380,530 440,300 500,560 560,210 620,550 680,320 740,540 800,240 860,520 920,290 980,560 1040,260"
            fill="none" stroke="#ef4444" stroke-width="8"/>
  <polyline points="140,470 260,465 380,468 500,464 620,467 740,466 860,468 980,465 1040,466"
            fill="none" stroke="#22c55e" stroke-width="8"/>

  <g font-family="Manrope, Segoe UI, Arial" font-size="22" fill="#fecaca">
    <text x="760" y="195">GC spikes without pool</text>
  </g>
  <g font-family="Manrope, Segoe UI, Arial" font-size="22" fill="#bbf7d0">
    <text x="670" y="448">Stable allocations with pool</text>
  </g>
</svg>