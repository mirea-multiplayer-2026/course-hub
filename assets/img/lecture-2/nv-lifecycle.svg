<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="t d">
<title id="t">NetworkVariable lifecycle</title><desc id="d">Жизненный цикл OnNetworkSpawn/OnValueChanged/OnNetworkDespawn</desc>
<rect width="1200" height="460" fill="#0f1a2c"/>
<g font-family="Manrope,Segoe UI,sans-serif" fill="#e7eefc" text-anchor="middle">
<text x="600" y="54" font-size="36" font-weight="800">OnValueChanged: правильный паттерн</text>
<line x1="120" y1="230" x2="1080" y2="230" stroke="#3f628e" stroke-width="6"/>
<rect x="140" y="180" width="150" height="100" rx="12" fill="#17243a" stroke="#35527a"/><text x="215" y="238" font-size="20">Spawn</text>
<rect x="330" y="180" width="200" height="100" rx="12" fill="#17243a" stroke="#35527a"/><text x="430" y="238" font-size="20">Subscribe + initial UI</text>
<rect x="570" y="180" width="180" height="100" rx="12" fill="#17243a" stroke="#35527a"/><text x="660" y="238" font-size="20">Value changes</text>
<rect x="790" y="180" width="160" height="100" rx="12" fill="#17243a" stroke="#35527a"/><text x="870" y="238" font-size="20">UI updates</text>
<rect x="980" y="180" width="140" height="100" rx="12" fill="#17243a" stroke="#35527a"/><text x="1050" y="238" font-size="20">Despawn</text>
<text x="600" y="390" font-size="22" fill="#9eb0c9">Подписка в OnNetworkSpawn, отписка в OnNetworkDespawn, initial UI сразу.</text>
</g></svg>
