<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img"><rect width="960" height="340" fill="#0f1a2c"/><text x="50" y="52" fill="#e7eefc" font-size="34" font-family="Manrope,Segoe UI,sans-serif" font-weight="800">Threshold epsilon: send only when changed</text><line x1="120" y1="220" x2="840" y2="220" stroke="#3f628e" stroke-width="6"/><circle cx="160" cy="220" r="11" fill="#ffd166"><animate attributeName="cx" values="160;190;220;255;320;350;420;520;650;690;760" dur="3s" repeatCount="indefinite"/></circle><text x="50" y="295" fill="#9eb0c9" font-size="22" font-family="Manrope,Segoe UI,sans-serif">Мелкие колебания игнорируются, отправляются только заметные изменения.</text></svg>
