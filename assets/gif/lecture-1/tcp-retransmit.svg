<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="t d">
  <title id="t">TCP retransmit flow</title>
  <desc id="d">TCP подтверждает доставку и пересылает потерянный пакет</desc>
  <rect width="960" height="340" fill="#0f1a2c"/>
  <text x="40" y="50" fill="#e7eefc" font-size="34" font-family="Manrope,Segoe UI,sans-serif" font-weight="800">TCP: подтверждение и повторная отправка</text>

  <text x="90" y="125" fill="#75e3ce" font-size="22" font-family="Manrope,Segoe UI,sans-serif">Client</text>
  <text x="810" y="125" fill="#ffd166" font-size="22" font-family="Manrope,Segoe UI,sans-serif">Server</text>

  <line x1="130" y1="150" x2="780" y2="150" stroke="#3f628e" stroke-width="3"/>
  <line x1="130" y1="210" x2="780" y2="210" stroke="#3f628e" stroke-width="3"/>

  <circle cx="150" cy="150" r="9" fill="#37c8a7">
    <animate attributeName="cx" values="150;780;150" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.48;0.49;0.58;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <circle cx="780" cy="210" r="8" fill="#ffd166">
    <animate attributeName="cx" values="780;150;780" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="begin" values="0.6s" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <line x1="430" y1="132" x2="430" y2="170" stroke="#ff6b6b" stroke-width="4" stroke-linecap="round"/>
  <text x="386" y="126" fill="#ffb4b4" font-size="15" font-family="Manrope,Segoe UI,sans-serif">loss</text>

  <text x="40" y="300" fill="#9eb0c9" font-size="21" font-family="Manrope,Segoe UI,sans-serif">Потерянный пакет будет отправлен повторно после подтверждений/таймаута.</text>
</svg>
