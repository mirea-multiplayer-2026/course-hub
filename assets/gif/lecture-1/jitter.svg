<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="t d">
  <title id="t">Jitter animation</title>
  <desc id="d">Нестабильная задержка вызывает рывки движения</desc>
  <rect width="960" height="340" fill="#0f1a2c"/>
  <text x="50" y="52" fill="#e7eefc" font-size="34" font-family="Manrope,Segoe UI,sans-serif" font-weight="800">Jitter: плавающая задержка</text>
  <line x1="120" y1="190" x2="840" y2="190" stroke="#3f628e" stroke-width="6"/>
  <circle cx="120" cy="190" r="12" fill="#ffd166">
    <animate attributeName="cx" values="120;220;410;470;690;760;840;120" keyTimes="0;0.15;0.35;0.45;0.72;0.82;0.92;1" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <text x="50" y="295" fill="#9eb0c9" font-size="22" font-family="Manrope,Segoe UI,sans-serif">Пакеты приходят неравномерно: объект движется рывками.</text>
</svg>
