<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Without pool animation</title>
  <desc id="d">Projectile repeatedly created and destroyed.</desc>
  <rect width="900" height="300" fill="#0f172a"/>
  <text x="24" y="40" fill="#e2e8f0" font-family="Manrope, Segoe UI, Arial" font-size="28" font-weight="700">No Pool: create to fly to destroy</text>

  <circle cx="120" cy="170" r="18" fill="#22c55e">
    <animate attributeName="opacity" values="0;1;1;0;0" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <circle cx="120" cy="170" r="12" fill="#f97316">
    <animate attributeName="cx" values="120;760;760;120" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0;0" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <circle cx="760" cy="170" r="24" fill="#ef4444" opacity="0">
    <animate attributeName="opacity" values="0;0;0.9;0;0" dur="2.4s" repeatCount="indefinite"/>
  </circle>
</svg>